[profile.default]
# Run every selected test so one failure does not hide unrelated regressions.
fail-fast = false
status-level = "fail"
final-status-level = "fail"
# Native rendering and loading tests require an explicitly selected GPU-backed run.
default-filter = "not (package(=byte-engine-ghi) & kind(=test) & binary(=rendering)) & not (package(=byte-engine) & kind(=test) & binary(=loading))"
