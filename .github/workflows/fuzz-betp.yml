name: Fuzz BETP

on:
  schedule:
    # Every Sunday at 04:00 UTC, an hour after the BESL run.
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        required: false
        default: "1200"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      # Let every target finish so one crash doesn't hide another.
      fail-fast: false
      matrix:
        include:
          - target: decode_packet
            args: -dict=fuzz/dictionaries/betp.dict -max_len=2048
          - target: client_session
            args: -max_len=8192
          - target: server_session
            args: -max_len=8192
    defaults:
      run:
        working-directory: crates/betp
    steps:
    - uses: actions/checkout@v7
    - name: Install cargo-fuzz
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-fuzz
    - name: Restore corpus
      # Each run saves its grown corpus under a new key; the newest one seeds the next run.
      uses: actions/cache@v6
      with:
        path: crates/betp/fuzz/corpus/${{ matrix.target }}
        key: betp-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
        restore-keys: |
          betp-fuzz-corpus-${{ matrix.target }}-
    - name: Fuzz ${{ matrix.target }}
      # cargo-fuzz defaults to the target it was built for. The prebuilt binary is musl, and
      # AddressSanitizer can't link against static musl libc, so pin the glibc target.
      run: cargo fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -- ${{ matrix.args }} -timeout=5 -max_total_time=${{ inputs.seconds || '1200' }}
    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: betp-fuzz-${{ matrix.target }}-artifacts
        path: crates/betp/fuzz/artifacts/${{ matrix.target }}
        if-no-files-found: ignore
