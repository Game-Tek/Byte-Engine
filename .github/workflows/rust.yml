name: Build Engine and Run Unit Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    strategy:
      matrix:
        os: [blacksmith-2vcpu-ubuntu-2404, blacksmith-2vcpu-windows-2025, blacksmith-6vcpu-macos-latest]
        profile: [dev, release]
        feature: [headed, network]
        include:
          - os: blacksmith-2vcpu-ubuntu-2404
            platform: linux
            rustflags: "-C target-feature=+aes,+sse2"
          - os: blacksmith-2vcpu-windows-2025
            platform: windows
            rustflags: "-C target-feature=+aes,+sse2"
          - os: blacksmith-6vcpu-macos-latest
            platform: macos
            rustflags: "-C target-feature=+aes,+neon"
    runs-on: ${{ matrix.os }}
    env:
      # gxhash validates cfg(target_feature), so each runner gets the matching baseline explicitly.
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache Cargo dependencies
      if: matrix.platform == 'linux'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    - name: Setup mold linker (Linux)
      if: matrix.platform == 'linux'
      uses: rui314/setup-mold@v1
    - name: Install Linux dependencies
      if: matrix.platform == 'linux'
      run: bash install_dependencies.sh
    - name: Install Vulkan SDK
      if: matrix.platform == 'linux' && matrix.feature == 'headed'
      uses: humbletim/setup-vulkan-sdk@v1.2.1
      with:
        vulkan-query-version: 1.3.204.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader
        vulkan-use-cache: true
    - name: Install DirectX Shader Compiler
      if: matrix.platform == 'windows'
      shell: powershell
      run: |
        # Every Windows matrix entry can execute resource-management HLSL tests, including network-only builds.
        $packageRoot = Join-Path $env:RUNNER_TEMP "directx"
        $packageId = "Microsoft.Direct3D.DXC"
        $packageVersion = "1.9.2607.13"
        $packageName = $packageId.ToLowerInvariant()
        $archive = Join-Path $env:RUNNER_TEMP "$packageName.zip"
        $install = Join-Path $packageRoot $packageId
        $url = "https://api.nuget.org/v3-flatcontainer/$packageName/$packageVersion/$packageName.$packageVersion.nupkg"
        Invoke-WebRequest $url -OutFile $archive
        Expand-Archive $archive -DestinationPath $install

        $dxcBin = Join-Path $install "build\native\bin\x64"
        $dxcDll = Join-Path $dxcBin "dxcompiler.dll"
        $dxcExecutable = Join-Path $dxcBin "dxc.exe"
        if (-not (Test-Path $dxcDll)) {
          throw "dxcompiler.dll was not found in Microsoft.Direct3D.DXC $packageVersion."
        }
        if (-not (Test-Path $dxcExecutable)) {
          throw "dxc.exe was not found in Microsoft.Direct3D.DXC $packageVersion."
        }
        $version = & $dxcExecutable --version 2>&1 | Out-String
        if ($LASTEXITCODE -ne 0 -or $version -notmatch "dxcompiler\.dll: 1\.9\(5402-") {
          throw "Microsoft.Direct3D.DXC $packageVersion did not report the required retail DXC commit 5402. Output: $version"
        }
        Write-Host $version.Trim()
        Add-Content $env:GITHUB_PATH $dxcBin

    - name: Install DirectX 12 Agility SDK
      if: matrix.platform == 'windows' && matrix.feature == 'headed'
      shell: powershell
      run: |
        $packageRoot = Join-Path $env:RUNNER_TEMP "directx"
        $packageId = "Microsoft.Direct3D.D3D12"
        $packageVersion = "1.619.5"
        $packageName = $packageId.ToLowerInvariant()
        $archive = Join-Path $env:RUNNER_TEMP "$packageName.zip"
        $install = Join-Path $packageRoot $packageId
        $url = "https://api.nuget.org/v3-flatcontainer/$packageName/$packageVersion/$packageName.$packageVersion.nupkg"
        Invoke-WebRequest $url -OutFile $archive
        Expand-Archive $archive -DestinationPath $install

        $agilityBin = Join-Path $install "build\native\bin\x64"
        if (-not (Test-Path (Join-Path $agilityBin "D3D12Core.dll"))) {
          throw "D3D12Core.dll was not found in Microsoft.Direct3D.D3D12 $packageVersion."
        }
        Add-Content $env:GITHUB_ENV "BYTE_ENGINE_D3D12_SDK_PATH=$agilityBin"
    - name: Install nextest
      uses: taiki-e/install-action@nextest
    - name: Build and test
      # The default Nextest profile excludes the native GHI rendering binary.
      run: cargo nextest run --workspace --cargo-profile ${{ matrix.profile }} --no-default-features --features ${{ matrix.feature }}
    - name: Run documentation tests
      if: matrix.platform == 'linux' && matrix.profile == 'dev' && matrix.feature == 'headed'
      run: cargo test --doc --workspace --no-default-features --features headed
    - name: Check documentation
      if: matrix.platform == 'linux' && matrix.profile == 'dev' && matrix.feature == 'headed'
      run: cargo doc --workspace --no-deps --no-default-features --features headed
    - name: Check formatting
      if: matrix.platform == 'linux' && matrix.profile == 'dev' && matrix.feature == 'headed'
      run: cargo fmt --all -- --check
    - name: Run Clippy
      if: matrix.profile == 'dev'
      run: cargo clippy --workspace --all-targets --no-default-features --features ${{ matrix.feature }}

  dependencies:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
    - uses: actions/checkout@v7
    - name: Check dependency policy
      uses: EmbarkStudios/cargo-deny-action@v2
