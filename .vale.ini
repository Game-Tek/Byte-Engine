# Prose lint for the hand-written documentation pages. Run it with
# `bun run check:style` from docs-site; that also fetches the Microsoft package
# into docs-site/styles. Errors fail the build, warnings print.
StylesPath = docs-site/styles
MinAlertLevel = warning
Packages = Microsoft
Vocab = ByteEngine

[*.mdx]
BasedOnStyles = Microsoft, ByteEngine

# The pages are specifications and tasks for engine developers: product and
# engine terms stay, headings may carry acronyms, and the charter asks its
# reader questions on purpose.
Microsoft.Headings = NO
Microsoft.HeadingAcronyms = NO
Microsoft.QuestionMarks = NO
Microsoft.FirstPerson = NO
Microsoft.Jargon = NO
Microsoft.UIVerbs = NO
Microsoft.GeneralURL = NO
Microsoft.Vocab = NO

# Errors fail the build; warnings print; suggestions show with
# `--minAlertLevel=suggestion`.
Microsoft.Foreign = error
Microsoft.We = error
Microsoft.Contractions = warning
Microsoft.Avoid = warning
Microsoft.Acronyms = warning
Microsoft.Semicolon = suggestion
Microsoft.Adverbs = suggestion
Microsoft.Terms = suggestion
Microsoft.Hyphens = suggestion
