cargo-features = ["profile-rustflags"]

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.95.0"

[workspace.lints.clippy]
cognitive_complexity = "warn"
excessive_nesting = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"

[profile.dev]
incremental = true
lto = "off"

[profile.bench]
debug = true
# This nightly corrupts macOS proc-macro dylibs when the bench profile inherits release stripping.
strip = false

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
strip = true
