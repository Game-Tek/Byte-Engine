[package]
name = "beld"
version = "0.1.1"
edition = "2021"
authors = ["Facundo Villa <facundovilla961@gmail.com>"]
description = "Command-line asset baking and resource inspection for Byte-Engine."
license = "MIT"
repository = "https://github.com/Game-Tek/Byte-Engine"
homepage = "https://github.com/Game-Tek/Byte-Engine"
readme = "../../README.md"
keywords = ["byte-engine", "assets", "resources", "baking", "cli"]
categories = ["command-line-utilities", "game-development"]
rust-version.workspace = true

[package.metadata.docs.rs]
rustc-args = ["-C", "target-feature=+aes,+sse2"]
rustdoc-args = ["-C", "target-feature=+aes,+sse2"]

[dependencies]
byte-engine = { path = "../byte-engine", version = "0.1.1" }
utils = { package = "byte-engine-utils", path = "../utils", version = "0.1.1" }
resource-management = { package = "byte-engine-resource-management", path = "../resource-management", version = "0.1.1", features = ["gpu-ibl", "gpu-mips"] }

clap = { version = "4.5.32", features = ["derive"] }
simple_logger = "5.0.0"
log = "0.4.26"
serde_json = "1.0.140"
sysinfo = "0.37.2"
