[package]
name = "byte-engine-besl"
version = "0.2.0"
edition = "2024"
authors = ["Facundo Villa <facundovilla961@gmail.com>"]
description = "Byte-Engine shader language parser, lexer, optimizer, and VM."
license = "MIT"
repository = "https://github.com/Game-Tek/Byte-Engine"
homepage = "https://github.com/Game-Tek/Byte-Engine"
documentation = "https://docs.rs/byte-engine-besl"
readme = "../../README.md"
keywords = ["byte-engine", "shader", "language", "parser"]
categories = ["parser-implementations", "game-development"]
rust-version.workspace = true

[lib]
name = "besl"

[[bench]]
name = "vm"
harness = false

[features]
# Derives serde and rkyv for the types other crates persist, such as `SamplerState` in a baked shader interface.
serialization = ["dep:serde", "dep:rkyv"]

[dependencies]
half = "2.7.1"
rkyv = { version = "0.8.15", features = ["unaligned"], optional = true }
serde = { version = "1.0.219", features = ["derive"], optional = true }

[dev-dependencies]
divan = "0.1.21"

[lints]
workspace = true
