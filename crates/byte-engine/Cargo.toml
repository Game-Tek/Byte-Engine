[package]
name = "byte-engine"
version = "0.2.0"
edition = "2024"
authors = ["Facundo Villa <facundovilla961@gmail.com>"]
description = "A composable Rust game engine focused on graphics, input, audio, physics, and retained UI."
license.workspace = true
repository = "https://github.com/Game-Tek/Byte-Engine"
homepage = "https://github.com/Game-Tek/Byte-Engine"
documentation = "https://byte-engine.0x44491229.dev/docs/api/latest/byte_engine"
readme = "../../README.md"
keywords = ["game-engine", "graphics", "rendering", "ui", "audio"]
categories = ["game-engines", "graphics", "rendering"]

rust-version.workspace = true

[package.metadata.docs.rs]
rustc-args = ["-C", "target-feature=+aes,+sse2"]
rustdoc-args = ["-C", "target-feature=+aes,+sse2"]

[features]
default = ["headed", "network"]
headed = ["dep:ahi", "dep:ghi", "dep:besl", "dep:base64", "dep:flate2", "dep:png", "resource-management/gpu-ibl", "resource-management/gpu-mips"]
network = ["client"]
client = ["dep:betp"]
dmx = ["dep:artnet_protocol"]
tracy = ["dep:tracing-log", "dep:tracing-tracy"]

[[bench]]
name = "alley"
harness = false

[[bench]]
name = "animation_graph"
harness = false

[[bench]]
name = "availability_graph"
harness = false

[[bench]]
name = "channel"
harness = false

[[bench]]
name = "audio_graph"
harness = false
required-features = ["headed"]

[[bench]]
name = "pathfinding"
harness = false

[dependencies]
base64 = { version = "0.13.1", optional = true }
bytemuck = { version = "1.25.0", features = ["derive", "min_const_generics"] }
flate2 = { version = "1.1.9", optional = true }
png = { version = "0.18.1", optional = true }
facet = "0.50.0-rc.7"
facet-json = "0.50.0-rc.7"
serde_json = "1.0.140"
utils = { package = "byte-engine-utils", path = "../utils", version = "0.2.0" }
ghi = { package = "byte-engine-ghi", path = "../ghi", version = "0.2.0", optional = true }
ahi = { package = "byte-engine-ahi", path = "../ahi", version = "0.2.0", optional = true }
besl = { package = "byte-engine-besl", path = "../besl", version = "0.2.0", optional = true }
resource-management = { package = "byte-engine-resource-management", path = "../resource-management", version = "0.2.0" }
math = { package = "byte-engine-math", path = "../math", version = "0.2.0" }
maths-rs = "1.0.0"
betp = { package = "byte-engine-betp", path = "../betp", version = "0.2.0", optional = true }

serde = "1.0.219"
log = "0.4.26"
env_logger = "0.11.10"
downcast-rs = "2.0.1"
oxhttp = { version = "0.3.1", default-features = false, features = ["server"] }
tracing = { version = "0.1.41" }
tracing-log = { version = "0.2.0", optional = true }
tracing-subscriber = { version = "0.3.20", features = ["fmt"] }
tracing-tracy = { version = "0.11.4", optional = true }
smallvec = "1.15.1"
smallbox = "0.8"
rustfft = "6.4.1"
realfft = "3.5.0"
hidapi = "2.6.1"
ctrlc = "3.5.1"
fontdue = "0.9.3"
artnet_protocol = { version = "0.4.4", optional = true }
half = "2.4.1"
bitflags = "2.11.1"
bumpalo = { version = "3", features = ["allocator_api", "collections"] }
compio = { version = "0.19.1", features = ["fs", "io", "macros", "time"] }
crossbeam-queue = "0.3.12"
kanal = "0.1.1"

[dev-dependencies]
divan = "0.1.21"

[lints]
workspace = true
