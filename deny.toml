[advisories]
ignore = [
	{ id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained transitive dependency of exr; no compatible replacement is available upstream." },
	{ id = "RUSTSEC-2026-0192", reason = "ttf-parser is an unmaintained transitive dependency of fontdue; replacing the font stack is separate migration work." },
	{ id = "RUSTSEC-2026-0194", reason = "Affected quick-xml releases are build dependencies of xcb and wayland-scanner and do not parse runtime input." },
	{ id = "RUSTSEC-2026-0195", reason = "Affected quick-xml releases are build dependencies of xcb and wayland-scanner and do not parse runtime input." },
]

[licenses]
allow = [
	"0BSD",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"CC0-1.0",
	"ISC",
	"MIT",
	"MPL-2.0",
	"PDDL-1.0",
	"Unicode-3.0",
	"Unlicense",
	"Zlib",
]
exceptions = [
	{ allow = ["LGPL-2.1-or-later"], crate = "r-efi" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/ash-rs/ash"]
