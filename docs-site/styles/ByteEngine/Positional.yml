extends: existence
message: "Avoid the positional reference '%s': name or link what you refer to."
link: https://learn.microsoft.com/style-guide/a-z-word-list-term-collections/a/above
level: warning
ignorecase: true
raw:
  - '\b(see|shown|listed|described|mentioned|discussed) (above|below)\b|\b(table|list|example|section|code|snippet|steps|diagram) (above|below)\b'
